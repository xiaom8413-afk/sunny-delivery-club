name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engine tests
        run: npm test
      - name: Build standalone game
        run: npm run build
      - name: Verify committed build is current
        run: git diff --exit-code -- 晴空派送局.html
